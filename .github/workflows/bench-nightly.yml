name: bench-nightly

# Manual or scheduled only. This is deliberately not a pull-request gate:
# benchmarks are noisy on shared runners and should not block a change. The
# job uploads manifests; it does not assert a latency threshold. Shared-runner
# numbers are not headline results.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: linux L1 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: bring up the demo
        run: make up
      - name: run the L1 benchmark
        run: make bench
      - name: upload benchmark manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whippet-bench-${{ github.run_id }}
          path: artifacts/bench/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: stop the stack
        if: always()
        run: make down || true
