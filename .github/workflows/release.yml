name: release

# Manual multi-arch image build placeholder.
#
# This workflow does NOT publish a signed release. SBOM generation and cosign
# signing are not implemented yet. Do not describe an image produced here as
# signed or attested until those steps exist.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (no latest)"
        required: true
        default: "v0.1.0"
      push:
        description: "Push to ghcr.io (requires packages: write)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and optionally push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          # No `latest` tag. Pin the version the operator typed.
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          # TODO(release): set sbom: true and publish the SPDX/CycloneDX
          # attestation. TODO(release): sign the digest with cosign and record
          # the signature in the release notes. Neither is implemented.
          sbom: false
