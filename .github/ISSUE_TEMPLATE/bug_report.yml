name: Bug report
description: Report a reproducible problem in Whippet (not a security issue).
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Whippet is a Phase 1 single-node demo, not a production system. Read the
        [scope and current security posture](https://github.com/cryptus-neoxys/whipet/blob/main/SECURITY.md)
        before reporting.

        **Do not report security vulnerabilities here.** Use the private
        reporting link in SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and why is it wrong?
      placeholder: A clear, specific description of the problem.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Pick the closest component.
      options:
        - Gateway / HTTP API / WebSocket
        - Matching engine / order book
        - Iggy journal / topics / offsets
        - Market data / dashboard
        - Simulator
        - Benchmark harness / manifest
        - CLI / snapshots / verify
        - Build, docs, or deployment
        - Other / unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Whippet version or commit
      description: The release version or `git rev-parse HEAD`.
      placeholder: "0.1.0 or a 40-character commit SHA"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: How was Whippet running?
      options:
        - cargo run (local)
        - Docker Compose (deploy/compose.yaml)
        - Docker run for Iggy only, node on the host
        - Other / unsure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, Docker/VM, Rust and Node versions, Iggy server and SDK versions.
      placeholder: "macOS 27.2, Apple M4, Docker 29.9.2, Rust 1.95, Iggy 0.10.0, SDK 0.12.0"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest sequence of commands or requests that shows the bug.
      render: bash
      placeholder: |
        1. Start Iggy with ...
        2. Run ...
        3. POST /api/orders with ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: What happened instead? Include relevant logs, stack traces, and error codes.
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Environment variables, Compose overrides, topic settings, and benchmark flags. Redact credentials, PATs, and private paths.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I can reproduce this on the pinned versions (Iggy 0.10.0, SDK 0.12.0, Whippet 0.1.x).
          required: true
        - label: I have redacted credentials, tokens, and runtime data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional. Maintainer agreement is still required before a pull request.
      options:
        - label: I can help test a fix.
        - label: I can open a pull request after maintainer agreement.
