# Single-node Apache Iggy 0.10 configuration example.
#
# The default Compose stack configures Iggy through the documented IGGY_*
# environment variables. This file is the equivalent file-based configuration
# for operators who prefer a checked config:
#
#   volumes:
#     - ./iggy/iggy.toml:/app/iggy.toml:ro
#   environment:
#     IGGY_CONFIG_PATH: /app/iggy.toml
#
# Data lives in the named volume mounted at /app/local_data. Do not replace
# this with a macOS bind mount.
#
# Tested with apache/iggy:0.10.0. The root username and password are supplied
# by IGGY_ROOT_USERNAME / IGGY_ROOT_PASSWORD at first boot, not stored here.

path = "local_data"

[node]
# Clients on the Compose network dial `iggy:8090`. Iggy requires an advertised
# address when a listener binds a wildcard.
advertised_address = "iggy"

[http]
enabled = true
address = "0.0.0.0:3000"

[http.metrics]
enabled = true
endpoint = "/metrics"

[tcp]
enabled = true
address = "0.0.0.0:8090"

[quic]
enabled = true
address = "0.0.0.0:8080"

[websocket]
enabled = true
address = "0.0.0.0:8092"

[cluster]
enabled = false

[memory_pool]
# 1 GiB is an option for a memory-constrained 3-node laptop Compose file. The
# single-node default stack keeps the upstream 4 GiB pool because it measured
# better on a 16 GB Docker Desktop VM.
enabled = true
size = "1 GiB"

[sharding]
# Four shards is the single-node M4 profile from the research dossier. Docker
# shares cores, so do not pin.
cpu_allocation = 4
pin_cores = false
partition_io_capacity = 32

[partition]
# Smaller WAL than the 256 MiB default; use this only after measuring it on the
# target host. The single-node default stack keeps 256 MiB.
wal_bytes_max = "136 MiB"

[logging]
file_enabled = false
level = "info"
